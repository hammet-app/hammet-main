<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="lb-title lb-desc">
  <title id="lb-title">Lekki–Ikoyi Link Bridge — Lagos Landmark</title>
  <desc id="lb-desc">Architectural illustration of the cable-stayed Lekki–Ikoyi Link Bridge with towering crossed-X pylon, luminous stay cables, curved highway deck, and lagoon waters.</desc>
  <defs>
    <!-- Sky Aura Gradient -->
    <radialGradient id="lb-sky-aura" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#3B0764" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#160D33" stop-opacity="0"/>
    </radialGradient>
    <!-- Tower Pylon Green Gradient (DevFest Lagos inspired) -->
    <linearGradient id="lb-pylon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <!-- Pylon Shadow Side -->
    <linearGradient id="lb-pylon-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#065F46"/>
    </linearGradient>
    <!-- Bridge Deck Asphalt / Surface -->
    <linearGradient id="lb-deck-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="50%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <!-- Lagoon Water Gradient -->
    <linearGradient id="lb-water-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0891B2" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#164E63" stop-opacity="0.6"/>
    </linearGradient>
    <!-- Cable Glow Filter -->
    <filter id="lb-glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Sky Aura -->
  <ellipse cx="600" cy="280" rx="580" ry="240" fill="url(#lb-sky-aura)"/>

  <!-- Lagoon Water & Shorelines -->
  <g id="lb-ground" class="landmark-ground">
    <!-- Water base fill -->
    <path d="M0 450 C250 435 550 420 850 400 C1020 390 1120 375 1200 370 L1200 600 L0 600 Z" fill="url(#lb-water-grad)"/>
    <path d="M0 486 C211 468 354 474 510 461 C735 442 961 445 1200 420" fill="none" stroke="#0891B2" stroke-width="2.5" opacity="0.85" vector-effect="non-scaling-stroke"/>
    <path d="M44 527 L431 450 M641 489 L1164 381" fill="none" stroke="#06B6D4" stroke-width="1.8" opacity="0.6" vector-effect="non-scaling-stroke"/>
    <path d="M22 507 L168 493 M198 501 L318 487 M917 461 L1065 447 M1084 439 L1181 431" fill="none" stroke="#22D3EE" stroke-width="1.5" opacity="0.75" vector-effect="non-scaling-stroke"/>
    <path d="M0 552 C217 528 381 534 542 518 C792 491 1006 498 1200 473" fill="none" stroke="#0284C7" stroke-width="2" opacity="0.5" vector-effect="non-scaling-stroke"/>
    <path d="M92 467 C276 469 410 444 553 431 C754 413 963 389 1110 357" fill="none" stroke="#0E7490" stroke-width="1.5" opacity="0.6" vector-effect="non-scaling-stroke"/>
  </g>

  <!-- Pylon & Highway Deck Structure -->
  <g id="lb-structure" class="landmark-structure">
    <!-- Pylon Legs (Crossed X Tall Tower) -->
    <path d="M564 72 L583 73 L625 270 L507 427 L486 424 L603 270Z" fill="url(#lb-pylon-grad)" stroke="#064E3B" stroke-width="2.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    <path d="M629 73 L649 72 L615 270 L718 402 L698 411 L594 270Z" fill="url(#lb-pylon-dark)" stroke="#064E3B" stroke-width="2.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    
    <!-- Pylon Pier Footings -->
    <path d="M486 424 L507 427 L500 444 L477 443Z M698 411 L718 402 L729 419 L707 428Z" fill="#047857" stroke="#064E3B" stroke-width="2" vector-effect="non-scaling-stroke"/>
    <!-- Pylon Upper Spire Trim -->
    <path d="M565 80 L591 165 L607 265 M645 80 L621 165 L601 265" fill="none" stroke="#34D399" stroke-width="4.5" opacity="0.9" vector-effect="non-scaling-stroke"/>

    <!-- Bridge Deck Roadway (Main Curving Span) -->
    <path d="M80 437 C227 434 354 414 501 400 C708 380 918 356 1118 322 L1125 340 C924 379 714 402 505 423 C345 440 211 460 84 460Z" fill="url(#lb-deck-grad)" stroke="#1E1B4B" stroke-width="2.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    
    <!-- Deck Fascia / Underbelly -->
    <path d="M85 460 C211 462 348 443 506 426 C719 405 926 382 1125 344 L1121 357 C920 395 715 417 507 439 C341 456 211 477 91 476Z" fill="#312E81" stroke="#4338CA" stroke-width="1.8" vector-effect="non-scaling-stroke"/>

    <!-- Concrete Bridge Piers / Columns in Lagoon -->
    <path d="M270 424 L287 423 L280 484 L263 485Z M853 365 L867 362 L864 424 L850 427Z M1041 337 L1054 334 L1052 395 L1038 398Z" fill="#E0E7FF" stroke="#312E81" stroke-width="2" vector-effect="non-scaling-stroke"/>
    <!-- Water Splashes at Pier Bases -->
    <path d="M250 485 L296 484 M842 427 L871 424 M1031 398 L1059 395" fill="none" stroke="#22D3EE" stroke-width="2.5" vector-effect="non-scaling-stroke"/>

    <!-- Central Navigation Span Pier -->
    <path d="M583 395 L615 391 L630 419 L569 426Z" fill="#C7D2FE" stroke="#312E81" stroke-width="2" vector-effect="non-scaling-stroke"/>
    <path d="M562 421 L638 412" fill="none" stroke="#22D3EE" stroke-width="2" opacity="0.8" vector-effect="non-scaling-stroke"/>

    <!-- Pylon Top Saddle Cap -->
    <path d="M565 94 L556 94 M650 94 L641 94" fill="none" stroke="#10B981" stroke-width="3" vector-effect="non-scaling-stroke"/>
    <!-- Guard Rail Highlight -->
    <path d="M91 438 C237 435 367 416 507 402 C713 382 918 359 1118 326" fill="none" stroke="#06B6D4" stroke-width="2" opacity="0.9" vector-effect="non-scaling-stroke"/>
  </g>

  <!-- Luminous Stay Cables (Fanning Array) -->
  <g id="lb-detail" class="landmark-detail">
    <!-- Left Fan Stay Cables (Tower to West Deck) -->
    <g stroke="#FFFFFF" opacity="0.85" filter="url(#lb-glow-cyan)">
      <path d="M556 96 L124 434 M556 96 L158 433 M556 96 L192 430 M556 96 L226 427 M556 96 L260 424 M556 96 L294 421 M556 96 L328 418 M556 96 L362 415 M556 96 L396 412 M556 96 L430 408 M556 96 L464 405 M556 96 L498 402 M556 96 L532 398 M556 96 L566 395" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
    </g>
    <!-- Right Fan Stay Cables (Tower to East Deck) -->
    <g stroke="#22D3EE" opacity="0.9" filter="url(#lb-glow-cyan)">
      <path d="M647 96 L626 390 M647 96 L660 384 M647 96 L694 378 M647 96 L728 372 M647 96 L762 366 M647 96 L796 360 M647 96 L830 354 M647 96 L864 348 M647 96 L898 342 M647 96 L932 336 M647 96 L966 330 M647 96 L1000 324 M647 96 L1034 318 M647 96 L1068 312 M647 96 L1102 306" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
    </g>

    <!-- Secondary Backstay Reinforcements -->
    <path d="M550 112 L141 434 M650 112 L648 386 M571 191 L207 428 M630 191 L784 362" stroke="#67E8F9" stroke-width="1.8" opacity="0.6" fill="none" vector-effect="non-scaling-stroke"/>

    <!-- Highway Lane White Markings -->
    <path d="M111 450 C242 450 365 431 506 414 C719 389 923 365 1122 336" stroke="#FFFFFF" stroke-width="2.5" stroke-dasharray="14 12" opacity="0.9" fill="none" vector-effect="non-scaling-stroke"/>
    <!-- Highway Kerb Line -->
    <path d="M90 464 C225 465 354 447 507 431 C719 410 924 387 1124 351" stroke="#F59E0B" stroke-width="2" opacity="0.8" fill="none" vector-effect="non-scaling-stroke"/>

    <!-- Street Lampposts with Glowing Lamps -->
    <g stroke="#374151" stroke-width="1.8" fill="none" vector-effect="non-scaling-stroke">
      <!-- Curved posts -->
      <path d="M180 448 C180 435 186 432 193 433"/>
      <path d="M314 434 C314 421 320 418 327 419"/>
      <path d="M445 420 C445 407 451 404 458 405"/>
      <path d="M690 400 C690 387 696 384 703 385"/>
      <path d="M820 382 C820 369 826 366 833 367"/>
      <path d="M950 365 C950 352 956 349 963 350"/>
      <!-- Glowing Lantern Heads -->
      <circle cx="193" cy="433" r="3.5" fill="#FBBF24" stroke="#F59E0B" stroke-width="1"/>
      <circle cx="327" cy="419" r="3.5" fill="#FBBF24" stroke="#F59E0B" stroke-width="1"/>
      <circle cx="458" cy="405" r="3.5" fill="#FBBF24" stroke="#F59E0B" stroke-width="1"/>
      <circle cx="703" cy="385" r="3.5" fill="#FBBF24" stroke="#F59E0B" stroke-width="1"/>
      <circle cx="833" cy="367" r="3.5" fill="#FBBF24" stroke="#F59E0B" stroke-width="1"/>
      <circle cx="963" cy="350" r="3.5" fill="#FBBF24" stroke="#F59E0B" stroke-width="1"/>
    </g>
  </g>

  <!-- Pylon Emerald Lighting Accents -->
  <g id="lb-accent" class="landmark-accent" fill="none" stroke="#34D399" stroke-width="2" vector-effect="non-scaling-stroke">
    <path d="M575 83 L590 170 M638 83 L622 170" opacity="0.9"/>
    <path d="M604 273 L502 420 M605 273 L704 397" opacity="0.85"/>
    <path d="M170 516 L224 510 M968 486 L1033 478" opacity="0.75" stroke="#06B6D4"/>
  </g>
</svg>
