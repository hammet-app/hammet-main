<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="nt-title nt-desc">
  <title id="nt-title">National Theatre, Iganmu — Lagos Landmark</title>
  <desc id="nt-desc">Architectural illustration of the National Theatre in Iganmu, Lagos with shallow saucer roof, leaning concrete fins, glowing glazing bands and stepped podium.</desc>
  <defs>
    <!-- Background Sunburst / Radial Halo -->
    <radialGradient id="nt-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#5B21B6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#3B0764" stop-opacity="0"/>
    </radialGradient>
    <!-- Roof Gradient -->
    <linearGradient id="nt-roof-grad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#4C1D95"/>
      <stop offset="50%" stop-color="#6D28D9"/>
      <stop offset="100%" stop-color="#3B0764"/>
    </linearGradient>
    <!-- Upper Rim Gold Gradient -->
    <linearGradient id="nt-rim-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <!-- Fin Highlight Gradient -->
    <linearGradient id="nt-fin-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EDE9FE"/>
      <stop offset="40%" stop-color="#C4B5FD"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <!-- Glass Band Dark Violet -->
    <linearGradient id="nt-glass-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E1035"/>
      <stop offset="50%" stop-color="#2E1065"/>
      <stop offset="100%" stop-color="#1E1035"/>
    </linearGradient>
    <!-- Podium Step Gradient -->
    <linearGradient id="nt-podium-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E9D5FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#C4B5FD" stop-opacity="0.6"/>
    </linearGradient>
    <!-- Cyan Window Glow -->
    <filter id="nt-glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Light Halo -->
  <ellipse cx="600" cy="380" rx="520" ry="260" fill="url(#nt-halo)"/>

  <!-- Podium / Ground Plaza -->
  <g id="nt-ground" class="landmark-ground">
    <path d="M115 528 C304 486 796 481 1084 532 C1048 579 827 612 575 616 C347 616 166 583 115 528Z" fill="url(#nt-podium-grad)" stroke="#5B21B6" stroke-width="2" vector-effect="non-scaling-stroke"/>
    <path d="M115 528 C309 488 813 484 1084 532 C1008 553 890 571 760 578 C504 592 254 575 115 528Z" fill="#F5F3FF" opacity="0.8" stroke="#4C1D95" stroke-width="2" vector-effect="non-scaling-stroke"/>
    <path d="M173 539 C371 574 814 574 1018 540" fill="none" stroke="#7C3AED" stroke-width="1.8" opacity="0.7" vector-effect="non-scaling-stroke"/>
    <path d="M171 548 C350 588 793 596 1004 548" fill="none" stroke="#8B5CF6" stroke-width="1.5" opacity="0.6" vector-effect="non-scaling-stroke"/>
    <!-- Plaza Walkway Lines -->
    <path d="M209 512 L186 528 M275 500 L251 520 M937 501 L960 521 M1001 511 L1024 530" fill="none" stroke="#6D28D9" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
  </g>

  <!-- Main Structure -->
  <g id="nt-structure" class="landmark-structure">
    <!-- Saucer Roof Outer Shell -->
    <path d="M230 260 C324 217 464 183 611 192 C766 201 913 240 1016 294 C1039 307 1046 320 1034 331 C1015 347 972 340 930 326 C827 290 713 272 605 279 C460 287 343 316 265 319 C222 321 197 309 203 297 C207 286 217 270 230 260Z" fill="url(#nt-roof-grad)" stroke="#3B0764" stroke-width="2.5" vector-effect="non-scaling-stroke"/>

    <!-- Roof Underlip -->
    <path d="M203 297 C294 312 387 314 496 300 C648 282 809 285 929 307 C980 317 1019 313 1034 331 L1027 350 C1004 361 969 359 927 350 C799 323 656 324 504 342 C377 358 272 356 216 342Z" fill="#3B0764" stroke="#2E1065" stroke-width="2.5" vector-effect="non-scaling-stroke"/>

    <!-- Upper Glazing Band -->
    <path d="M255 279 C339 262 444 249 556 248 C690 246 815 264 931 286 L927 307 C809 286 651 282 504 300 C401 312 322 315 265 305Z" fill="url(#nt-glass-grad)" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.8" vector-effect="non-scaling-stroke"/>

    <!-- Concrete Fins Array -->
    <path d="M232 293 L277 268 L310 486 L280 504 L245 472Z M300 296 L337 279 L365 489 L341 505 L316 480Z M365 296 L397 284 L419 492 L396 507 L375 481Z M430 291 L457 282 L475 494 L453 507 L438 482Z M496 285 L520 279 L534 497 L512 508 L501 482Z M562 280 L583 277 L594 499 L573 509 L566 483Z M628 279 L649 279 L655 498 L635 508 L631 482Z M694 280 L719 282 L718 494 L699 506 L699 480Z M760 282 L790 286 L781 490 L761 504 L765 477Z M826 285 L861 292 L842 485 L820 499 L829 473Z M891 289 L932 298 L901 479 L878 492 L895 468Z M953 292 L1000 302 L960 467 L935 482 L956 454Z" fill="url(#nt-fin-grad)" stroke="#3B0764" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>

    <!-- Middle Balcony Band -->
    <path d="M253 357 C372 374 479 373 602 356 C723 340 837 343 948 363 L944 391 C824 371 720 369 604 385 C473 403 360 402 259 383Z" fill="#4C1D95" stroke="#6D28D9" stroke-width="2" vector-effect="non-scaling-stroke"/>

    <!-- Lower Glazing Band -->
    <path d="M257 397 C362 412 480 413 606 396 C731 379 832 381 940 401 L935 420 C827 401 732 400 608 417 C478 435 358 433 261 416Z" fill="url(#nt-glass-grad)" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.85" vector-effect="non-scaling-stroke"/>

    <!-- Base Tier / Lower Podium Shell -->
    <path d="M267 417 C373 433 486 435 612 418 C736 401 829 402 933 421 L924 478 C816 463 714 463 610 477 C488 493 372 489 276 474Z" fill="url(#nt-fin-grad)" stroke="#3B0764" stroke-width="2" vector-effect="non-scaling-stroke"/>
    <path d="M276 476 C377 493 491 496 612 480 C726 465 818 465 924 480" fill="none" stroke="#F59E0B" stroke-width="3" vector-effect="non-scaling-stroke"/>
  </g>

  <!-- Architectural Details & Windows -->
  <g id="nt-detail" class="landmark-detail">
    <!-- Fin Ridges -->
    <path d="M278 268 L312 481 M336 279 L365 485 M396 284 L418 488 M457 282 L476 490 M520 279 L535 492 M583 277 L594 494 M649 279 L655 493 M719 282 L718 489 M790 286 L781 485 M861 292 L842 480 M932 298 L901 474 M1000 302 L960 462" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1.5" fill="none" vector-effect="non-scaling-stroke"/>
    
    <!-- Curved Fascia Lines -->
    <path d="M270 306 C407 321 505 303 606 291 C730 276 826 283 944 309" stroke="#06B6D4" stroke-width="2" fill="none" opacity="0.9" vector-effect="non-scaling-stroke"/>
    <path d="M283 326 C392 340 498 329 606 315 C730 299 835 302 937 326" stroke="#7C3AED" stroke-width="1.8" fill="none" opacity="0.8" vector-effect="non-scaling-stroke"/>

    <!-- Glowing Balcony Glazing Ovals (Cyan / Gold) -->
    <g filter="url(#nt-glow-cyan)" stroke="#06B6D4" stroke-width="1.5">
      <ellipse cx="307" cy="363" rx="14" ry="9" fill="#06B6D4" opacity="0.95"/>
      <ellipse cx="360" cy="369" rx="14" ry="9" fill="#06B6D4" opacity="0.95"/>
      <ellipse cx="416" cy="370" rx="14" ry="9" fill="#06B6D4" opacity="0.95"/>
      <ellipse cx="475" cy="366" rx="14" ry="9" fill="#06B6D4" opacity="0.95"/>
      <ellipse cx="537" cy="360" rx="14" ry="9" fill="#06B6D4" opacity="0.95"/>
      <ellipse cx="600" cy="353" rx="14" ry="9" fill="#FBBF24" opacity="0.95"/>
      <ellipse cx="664" cy="351" rx="14" ry="9" fill="#FBBF24" opacity="0.95"/>
      <ellipse cx="729" cy="353" rx="14" ry="9" fill="#06B6D4" opacity="0.95"/>
      <ellipse cx="793" cy="359" rx="14" ry="9" fill="#06B6D4" opacity="0.95"/>
      <ellipse cx="855" cy="367" rx="14" ry="9" fill="#06B6D4" opacity="0.95"/>
      <ellipse cx="911" cy="375" rx="14" ry="9" fill="#06B6D4" opacity="0.95"/>
    </g>

    <!-- Lower Window Mullions -->
    <path d="M297 430 L292 472 M326 434 L323 477 M355 437 L354 481 M384 438 L385 483 M414 440 L417 486 M445 440 L450 488 M477 438 L483 489 M509 434 L516 489 M542 430 L549 488 M576 425 L584 486 M610 420 L617 484 M645 416 L651 480 M680 413 L684 477 M715 411 L717 475 M750 411 L749 474 M785 412 L782 474 M820 414 L815 475 M855 417 L848 477 M888 420 L880 478 M917 424 L909 479" stroke="#6D28D9" stroke-width="1.5" opacity="0.8" fill="none" vector-effect="non-scaling-stroke"/>
  </g>

  <!-- Crown Gold Accents -->
  <g id="nt-accent" class="landmark-accent" fill="url(#nt-rim-gold)" stroke="#D97706" stroke-width="1.5" vector-effect="non-scaling-stroke">
    <path d="M347 225 L359 222 L360 233 L348 236Z M433 211 L446 209 L447 219 L434 222Z M534 202 L547 201 L548 211 L535 212Z M638 202 L651 203 L650 213 L637 212Z M742 206 L755 208 L753 218 L740 216Z M844 216 L857 219 L854 229 L841 226Z M935 232 L947 236 L943 245 L931 241Z"/>
    <path d="M203 528 L228 524 M976 526 L1001 530 M311 567 L333 570 M865 566 L889 562" fill="none" stroke="#F59E0B" stroke-width="2.5" opacity="0.9"/>
  </g>
</svg>
